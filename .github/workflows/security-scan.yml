name: Security scan

# Reusable scan called by every code repository in the org.
# These repositories are public and hold Terraform for a real AWS account, so this runs
# on pull requests as a merge gate, not only on a schedule.

on:
  workflow_call:
    inputs:
      iac:
        description: Also run infrastructure-as-code misconfiguration scanning
        type: boolean
        default: true
      allow_tfvars:
        description: >-
          Permit committed .tfvars files. Default false, which is what every
          repository should want. Opt in ONLY where the tfvars are known to hold
          nothing but values already public in the repository - account ids and
          ARNs that a backend block has to hardcode anyway. A tfvars carrying an
          email address, a hostname, a token or a licence key is not a candidate,
          and enabling this does not make it one.
        type: boolean
        default: false

# A reusable workflow's own permissions block defines the token - it is not inherited
# from, or merged with, the caller. security-events:write is required by upload-sarif.
permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: a secret removed in a later commit still leaks

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --redact --verbose \
            --report-format sarif --report-path /repo/gitleaks.sarif

      - name: Upload findings
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  forbidden-files:
    name: Forbidden files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Native secret scanning catches credential patterns. It does not catch a committed
      # tfvars file, a state file, or a kubeconfig - which leak just as much.
      #
      # tfvars is the only entry a caller can switch off, via allow_tfvars. State files
      # and key material are not negotiable: there is no repository for which committing
      # them is correct.
      - name: Block state, tfvars, kubeconfig and key material
        env:
          ALLOW_TFVARS: ${{ inputs.allow_tfvars }}
        run: |
          # (^|/)\.terraform/ not ^\.terraform/ - every Terraform layer keeps its own
          # nested .terraform/, so the root-anchored form matched nothing in a
          # multi-layer repository, which is all of them.
          alts='terraform\.tfstate|\.tfstate\.backup$|(^|/)\.terraform/|kubeconfig|\.kube/config|\.pem$|\.p12$|\.pfx$|id_rsa|\.env$'
          if [ "${ALLOW_TFVARS}" = "true" ]; then
            echo "::notice::allow_tfvars is set - .tfvars files are permitted in this repository."
          else
            alts='\.tfvars$|\.tfvars\.json$|'"${alts}"
          fi

          bad=$(git ls-files | grep -E "(${alts})" || true)
          if [ -n "$bad" ]; then
            echo "::error::Files that must never be committed:"
            echo "$bad"
            exit 1
          fi
          echo "No forbidden files present."

      # A 12-digit AWS account id is not a credential, but publishing one narrows an
      # attacker's work. Allow it only where deliberately placed in a .example file.
      - name: Warn on bare AWS account ids
        run: |
          hits=$(grep -rEn '(^|[^0-9])[0-9]{12}([^0-9]|$)' \
            --include='*.tf' --include='*.tfvars.example' --include='*.yaml' --include='*.yml' \
            . 2>/dev/null | grep -v '\.example:' || true)
          if [ -n "$hits" ]; then
            echo "::warning::Possible AWS account ids - move these to variables:"
            echo "$hits"
          fi

  iac:
    name: IaC misconfiguration
    if: inputs.iac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'   # report, do not block, until the baseline is clean

      - name: Upload findings
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-iac
