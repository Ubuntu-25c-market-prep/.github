name: Security scan

# Reusable scan called by every code repository in the org.
# These repositories are public and hold Terraform for a real AWS account, so this runs
# on pull requests as a merge gate, not only on a schedule.

on:
  workflow_call:
    inputs:
      iac:
        description: Also run infrastructure-as-code misconfiguration scanning
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: a secret removed in a later commit still leaks

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose \
            --report-format sarif --report-path /repo/gitleaks.sarif

      - name: Upload findings
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  forbidden-files:
    name: Forbidden files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Native secret scanning catches credential patterns. It does not catch a committed
      # tfvars file, a state file, or a kubeconfig - which leak just as much.
      - name: Block state, tfvars, kubeconfig and key material
        run: |
          bad=$(git ls-files | grep -E \
            '(\.tfvars$|\.tfvars\.json$|terraform\.tfstate|\.tfstate\.backup$|^\.terraform/|kubeconfig|\.kube/config|\.pem$|\.p12$|\.pfx$|id_rsa|\.env$)' \
            || true)
          if [ -n "$bad" ]; then
            echo "::error::Files that must never be committed:"
            echo "$bad"
            exit 1
          fi
          echo "No forbidden files present."

      # A 12-digit AWS account id is not a credential, but publishing one narrows an
      # attacker's work. Allow it only where deliberately placed in a .example file.
      - name: Warn on bare AWS account ids
        run: |
          hits=$(grep -rEn '(^|[^0-9])[0-9]{12}([^0-9]|$)' \
            --include='*.tf' --include='*.tfvars.example' --include='*.yaml' --include='*.yml' \
            . 2>/dev/null | grep -v '\.example:' || true)
          if [ -n "$hits" ]; then
            echo "::warning::Possible AWS account ids - move these to variables:"
            echo "$hits"
          fi

  iac:
    name: IaC misconfiguration
    if: inputs.iac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'   # report, do not block, until the baseline is clean

      - name: Upload findings
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-iac
